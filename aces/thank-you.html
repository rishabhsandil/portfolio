<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank You | Aspire</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/brand/favicon.png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
<!-- ============ Meta Pixel Code ============
     Replace YOUR_PIXEL_ID with the client's Meta (Facebook) Pixel ID.
     This page loads in a new tab when a form is completed, so the "Lead"
     event below counts each finished form submission as a conversion. -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', 'YOUR_PIXEL_ID');
fbq('track', 'PageView');
fbq('track', 'Lead');
</script>
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=YOUR_PIXEL_ID&ev=Lead&noscript=1"/></noscript>
<!-- ============ End Meta Pixel Code ============ -->
</head>
<body>

<div data-include="components/header-lp.html"></div>

<main>
<section class="section" style="min-height:72vh;display:flex;align-items:center">
  <div class="container">
    <div class="ty-wrap" style="max-width:620px;margin:0 auto;text-align:center">
      <div style="width:74px;height:74px;border-radius:999px;background:rgba(4,117,143,.1);border:1px solid var(--teal);display:grid;place-items:center;margin:0 auto 1.5rem;color:var(--teal)">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <p class="eyebrow" style="justify-content:center">Submission received</p>
      <h1 class="h-display" style="margin:.4rem 0 .9rem;font-size:clamp(1.9rem,4vw,2.9rem)">Thank you for filling out the form.</h1>
      <p class="lead" style="margin:0 auto 1.8rem;max-width:44ch">Someone from our team will reach out to you as soon as possible.</p>
      <a href="index.html" class="btn btn-accent">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        Go Back</a>
    </div>
  </div>
</section>
</main>

<div data-include="components/footer-lp.html"></div>

<script src="js/main.js"></script>
</body>
</html>
